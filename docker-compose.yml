services:

  postgres:
    image: postgres:16-alpine
    container_name: demo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - demo-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - customer-net

  inventory-service:
    build:
      context: ./inventory-service
    image: yoon2001/test-customer-inventory:latest
    container_name: inventory-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      DB_HOST: postgres
      DB_NAME: demo
      DB_USERNAME: demo
      DB_PASSWORD: demo
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx300m -XX:+UseSerialGC -XX:MaxMetaspaceSize=80m"
    ports:
      - "17003:17003"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:17003/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - customer-net

  payment-service:
    build:
      context: ./payment-service
    image: yoon2001/test-customer-payment:latest
    container_name: payment-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      DB_HOST: postgres
      DB_NAME: demo
      DB_USERNAME: demo
      DB_PASSWORD: demo
      INVENTORY_SERVICE_URL: http://inventory-service:17003
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx300m -XX:+UseSerialGC -XX:MaxMetaspaceSize=80m"
    ports:
      - "17002:17002"
    depends_on:
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:17002/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - customer-net

  recommendation-agent:
    build:
      context: ./recommendation-agent
    image: yoon2001/test-customer-recommendation:latest
    container_name: recommendation-agent
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DATABASE_URL: postgresql://demo:demo@postgres:5432/demo
    ports:
      - "17004:17004"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:17004/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - customer-net

  order-service:
    build:
      context: ./order-service
    image: yoon2001/test-customer-order:latest
    container_name: order-service
    restart: unless-stopped
    mem_limit: 384m
    environment:
      DB_HOST: postgres
      DB_NAME: demo
      DB_USERNAME: demo
      DB_PASSWORD: demo
      PAYMENT_SERVICE_URL: http://payment-service:17002
      INVENTORY_SERVICE_URL: http://inventory-service:17003
      RECOMMENDATION_AGENT_URL: http://recommendation-agent:17004
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx300m -XX:+UseSerialGC -XX:MaxMetaspaceSize=80m"
    ports:
      - "17001:17001"
    depends_on:
      payment-service:
        condition: service_healthy
      recommendation-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:17001/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - customer-net

  frontend:
    image: nginx:alpine
    container_name: demo-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "17005:80"
    depends_on:
      - order-service
    networks:
      - customer-net

networks:
  customer-net:
    driver: bridge

volumes:
  demo-pg-data:
