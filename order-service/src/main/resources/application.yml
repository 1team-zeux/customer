server:
  port: 17001

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:demo}
    username: ${DB_USERNAME:demo}
    password: ${DB_PASSWORD:demo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 15000
          payment-service:
            url: ${PAYMENT_SERVICE_URL:http://payment-service:17002}
          inventory-chaos:
            url: ${INVENTORY_SERVICE_URL:http://inventory-service:17003}

management:
  endpoints:
    web:
      exposure:
        include: health,info

recommendationAgent:
  url: ${RECOMMENDATION_AGENT_URL:http://recommendation-agent:17004}
